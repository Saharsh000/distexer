[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "distexer"
version = "0.1.0"
description = "The headless STEM & math presentation engine for Discord bots: LaTeX → Unicode, auto-lists, match-the-following layouts and browser-free formula images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saharsh", email = "Saharsh000@users.noreply.github.com" }]
keywords = ["discord", "latex", "katex", "math", "unicode", "discord.py", "bot", "trivia", "stem", "chemistry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
discord = ["discord.py>=2.3"]
all = ["matplotlib>=3.7", "discord.py>=2.3"]
dev = ["pytest>=7", "matplotlib>=3.7", "discord.py>=2.3"]

[project.urls]
Homepage = "https://github.com/Saharsh000/distexer"
Issues = "https://github.com/Saharsh000/distexer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/distexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
